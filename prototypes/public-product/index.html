<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public product preview | Carbone</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
      color: #15191b;
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .notice {
      padding: 10px 24px;
      background: #15191b;
      color: #fff;
      text-align: center;
      font-size: 12px;
      letter-spacing: .04em;
    }
    header { border-bottom: 1px solid #e8ebea; }
    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: .08em; }
    .brand-detail { display: block; margin-top: 3px; font-size: 10px; font-weight: 500; letter-spacing: .14em; }
    main { max-width: 1200px; margin: auto; padding: 44px 24px 80px; }
    .back-link { display: inline-block; margin-bottom: 24px; color: #15191b; font-size: 14px; font-weight: 600; }
    .back-link:focus-visible { outline: 3px solid #15191b; outline-offset: 3px; }
    .eyebrow { color: #687578; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .product { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: 64px; align-items: start; margin-top: 24px; }
    .product[hidden] { display: none; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; background: #f3f5f2; }
    figcaption { margin-top: 10px; color: #687578; font-size: 12px; }
    .details { padding-top: 12px; }
    h1 { margin: 14px 0 20px; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.12; letter-spacing: -.025em; }
    .sku { color: #687578; font-size: 13px; overflow-wrap: anywhere; }
    .sign-in { margin-top: 28px; }
    .sign-in {
      display: inline-block;
      padding: 16px 22px;
      border-radius: 14px;
      background: #0e9ca4;
      color: #15191b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
    }
    .sign-in:hover { background: #0b838a; }
    .sign-in:focus-visible { outline: 3px solid #15191b; outline-offset: 3px; }
    @media (max-width: 700px) {
      main { padding-top: 28px; }
      .product { grid-template-columns: 1fr; gap: 24px; }
      .details { padding-top: 0; }
      .sign-in { width: 100%; }
    }
  </style>
  <script src="./product-fixture.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const sku = new URLSearchParams(window.location.search).get('sku');
      const product = publicProducts.find((item) => item.sku === sku);
      const productView = document.querySelector('#product');
      const notFound = document.querySelector('#not-found');
      if (!product) {
        if (notFound instanceof HTMLElement) notFound.hidden = false;
        return;
      }
      const name = document.querySelector('#product-name');
      const productSku = document.querySelector('#product-sku');
      const category = document.querySelector('#product-category');
      const image = document.querySelector('#product-image');
      if (name) name.textContent = product.name;
      if (productSku) productSku.textContent = product.sku;
      if (category) category.textContent = product.category;
      if (image instanceof HTMLImageElement) {
        image.src = product.image;
        image.alt = product.name;
      }
      if (productView instanceof HTMLElement) productView.hidden = false;
    });
  </script>
</head>
<body>
  <div class="notice">Local prototype · Public product preview</div>
  <header>
    <div class="header-inner">
      <div class="brand">CARBONE<span class="brand-detail">FLORAL DISTRIBUTORS</span></div>
    </div>
  </header>
  <main>
    <a class="back-link" href="./catalog.html">Back to catalog</a>
    <div class="eyebrow">Public catalog / Roses</div>
    <noscript>Enable JavaScript to view the local product fixture.</noscript>
    <section id="not-found" hidden>
      <h1>Product not found</h1>
      <p>Select a product from the catalog.</p>
    </section>
    <div class="product" id="product" hidden>
      <figure>
        <img id="product-image" alt="">
      </figure>
      <section class="details" aria-labelledby="product-name">
        <div class="eyebrow" id="product-category"></div>
        <h1 id="product-name">Product details unavailable</h1>
        <p class="sku">SKU: <span id="product-sku">Unavailable</span></p>
        <a class="sign-in" href="https://0igxkv-sp.myshopify.com/">Sign in for wholesale pricing and ordering</a>
      </section>
    </div>
  </main>
</body>
</html>
