<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public catalog preview | Carbone</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
      color: #15191b;
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .notice {
      padding: 10px 24px;
      background: #15191b;
      color: #fff;
      text-align: center;
      font-size: 12px;
      letter-spacing: .04em;
    }
    header { border-bottom: 1px solid #e8ebea; }
    .header-inner { max-width: 1200px; margin: auto; padding: 24px; }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: .08em; }
    .brand-detail { display: block; margin-top: 3px; font-size: 10px; font-weight: 500; letter-spacing: .14em; }
    main { max-width: 1200px; margin: auto; padding: 44px 24px 80px; }
    .eyebrow { color: #687578; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 14px 0 24px; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.12; letter-spacing: -.025em; }
    .product-card { max-width: 360px; border: 1px solid #e8ebea; }
    .product-card img { display: block; width: 100%; height: auto; background: #f3f5f2; }
    .card-details { padding: 20px; }
    .card-details h2 { margin: 0 0 20px; font-size: 20px; line-height: 1.3; }
    .view-product {
      display: inline-block;
      padding: 16px 22px;
      border-radius: 14px;
      background: #0e9ca4;
      color: #15191b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
    }
    .view-product:hover { background: #0b838a; }
    .view-product:focus-visible { outline: 3px solid #15191b; outline-offset: 3px; }
    @media (max-width: 700px) {
      main { padding-top: 28px; }
      .view-product { width: 100%; }
    }
  </style>
  <script src="./product-fixture.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const name = document.querySelector('#product-name');
      const image = document.querySelector('#product-image');
      if (name) name.textContent = publicProduct.name;
      if (image instanceof HTMLImageElement) {
        image.src = publicProduct.image;
        image.alt = publicProduct.imageAlt;
      }
    });
  </script>
</head>
<body>
  <div class="notice">Local prototype · Public catalog preview</div>
  <header>
    <div class="header-inner">
      <div class="brand">CARBONE<span class="brand-detail">FLORAL DISTRIBUTORS</span></div>
    </div>
  </header>
  <main>
    <div class="eyebrow">Public catalog / Floral stems</div>
    <h1>Floral stems</h1>
    <article class="product-card" aria-labelledby="product-name">
      <img id="product-image" src="./poinsettia-placeholder.svg" alt="Illustrative placeholder for a red poinsettia stem" width="640" height="720">
      <div class="card-details">
        <h2 id="product-name">Product details unavailable</h2>
        <a class="view-product" href="./index.html">View product</a>
      </div>
    </article>
  </main>
</body>
</html>
